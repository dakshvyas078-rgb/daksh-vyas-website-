  <style>
    :root { color-scheme: dark; --gold:#d9b45b; --gold-light:#f4dc94; --bg:#080808; --muted:#b7b3a8; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin:0; min-height:100vh; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#fff; background: radial-gradient(ellipse at 50% 20%, #292010 0, #11100d 30%, var(--bg) 70%); display:flex; align-items:center; justify-content:center; padding:28px 16px; }
    .wrap { width:min(100%, 520px); text-align:center; animation: rise .8s ease both; }

    .portrait { width:100%; height:100%; display:block; border-radius:50%; object-fit:cover; background:#181818; border:3px solid #090909; }
    h1 { margin:0; font-size:clamp(2.2rem, 8vw, 3.5rem); line-height:1.05; letter-spacing:-.045em; font-weight:750; }
    h1 span { color:var(--gold-light); }
    .subtitle { color:var(--muted); margin:14px auto 30px; font-size:1rem; line-height:1.65; max-width:340px; }
    .links { display:grid; gap:13px; }
    .social { display:flex; align-items:center; justify-content:center; gap:12px; padding:16px 20px; border-radius:14px; text-decoration:none; font-weight:650; letter-spacing:.01em; transition:transform .2s ease, box-shadow .2s ease, background .2s ease; }
    .social:hover, .social:focus-visible { transform:translateY(-3px); box-shadow:0 10px 28px #0008; outline:2px solid var(--gold-light); outline-offset:3px; }
    .instagram { color:#111; background:linear-gradient(110deg, #f7e4a0, #d6ad4b); }
    .facebook { color:#f7e7bd; border:1px solid #a98235; background:#17140e; }
    .icon { width:22px; height:22px; flex:none; }
    .divider { height:1px; width:76px; margin:30px auto 20px; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
    .footer { color:#777166; font-size:.78rem; letter-spacing:.08em; }
    .spark { color:var(--gold); }
    @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }
